# One-click deploy: https://render.com/deploy?repo=https://github.com/dineshsai05/sarvam-hackathon
services:
  - type: web
    name: insurewise-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurewise-db
          property: connectionString
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: SARVAM_ORG_ID
        value: 01a19665-d999-7047-9b3f-3adb3911dfff
      - key: SARVAM_WORKSPACE_ID
        value: 01a19665-d9a1-752e-834b-91ec0262df74
      - key: SARVAM_APP_ID
        value: InsureWise-a0e53d7b-fb8f
      - key: SARVAM_APP_VERSION
        value: "2"
      - key: SARVAM_CONNECTION_ID
        value: 335aed79-0f-57c24213-443a
      - key: SARVAM_AGENT_PHONE_NUMBER
        value: "+918064269894"
      - key: SARVAM_API_KEY
        sync: false            # entered once in the Render dashboard, never stored in git
      - key: CORS_ORIGINS
        value: http://localhost:3000
      # PUBLIC_BASE_URL is not needed: the app falls back to RENDER_EXTERNAL_URL
databases:
  - name: insurewise-db
    plan: free
    region: singapore
